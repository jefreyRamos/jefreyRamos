<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="50%" y2="0%">
      <stop offset="0%" style="stop-color:lightblue; stop-opacity:0.6">
        <animate attributeName="stop-color" values="#0d3d56;lightgrey;#0d3d56" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" style="stop-color:lightblue; stop-opacity:0.9">
        <animate attributeName="stop-color" values="lightgrey;#0d3d56;lightgrey" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <text fill="url(#gradient)" x="600" y="50" font-size="25" text-anchor="middle">
    一歩一歩があなたを過去の自分から遠ざけ、あなたがなりたい自分へと近づけていきます。
  </text>
</svg>

